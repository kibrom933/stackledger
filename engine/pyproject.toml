[project]
name = "driftig-engine"
version = "0.1.0"
description = "Research, drafting, QA, distribution and reporting jobs for Driftig"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.70",
  "pydantic>=2.7",
  "python-frontmatter>=1.1",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
driftig = "driftig_engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["driftig_engine*"]
